name: Option B validation
on:
  push:
    branches: [main, integration/frontend-backend]
    paths: [infra/**, scripts/**, performance/**, compose.yaml, backend/**, frontend/**, .github/workflows/cloud.yml]
  pull_request:
    paths: [infra/**, scripts/**, performance/**, compose.yaml, backend/**, frontend/**, .github/workflows/cloud.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_API_TOKEN: ci-only-management-code-32-characters-long
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infra/option-b.json
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify real container API and idempotency
        run: |
          docker compose exec -T backend node scripts/seed.js --force
          node scripts/check-deployment.cjs http://localhost:8080
      - name: Verify production browser integration
        run: |
          npm --prefix frontend ci
          cd frontend && npx playwright install --with-deps chromium && cd ..
          node scripts/check-browser-deployment.mjs http://localhost:8080
      - if: always()
        run: docker compose down
