name: airbnb-option-b
services:
  mongo:
    image: mongo:8.2
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.2
    depends_on:
      mongo: {condition: service_healthy}
    restart: 'no'
    entrypoint: [mongosh, --host, 'mongo:27017', --quiet, --eval]
    command:
      - "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); } while (!db.hello().isWritablePrimary) { sleep(500); }"
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/airbnb_soa?replicaSet=rs0
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      METRICS_ENABLED: 'true'
      METRICS_ENVIRONMENT: local-compose
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: /}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    init: true
volumes:
  mongo-data:
